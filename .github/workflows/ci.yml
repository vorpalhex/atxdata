name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Install, types, and Prettier
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Select comparison base
        shell: bash
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA=$(git hash-object -t tree /dev/null)
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          fi
          printf 'BASE_SHA=%s\n' "$BASE_SHA" >> "$GITHUB_ENV"
      - name: Frozen install and typecheck changed programs
        shell: bash
        run: |
          for program in programs/*; do
            [[ -f "$program/package.json" ]] || continue
            if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- "$program" .github/workflows/ci.yml; then
              continue
            fi
            echo "::group::$program"
            (cd "$program" && bun install --frozen-lockfile && bun run typecheck)
            echo '::endgroup::'
          done
      - name: Check formatting of changed files
        shell: bash
        run: |
          # A config change can affect unchanged files, so check the whole tree.
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- .prettierrc.json .prettierignore; then
            git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" "$HEAD_SHA" |
              xargs -0 -r bunx prettier@3.9.10 --check --ignore-unknown --
          else
            git ls-files -z |
              xargs -0 -r bunx prettier@3.9.10 --check --ignore-unknown --
          fi
